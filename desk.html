<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#14222a;--dim:#5f737a;--line:#d8e0dc;--up:#0f8a5f;--down:#c8384f;--accent:#0d5c63;--on:#fff;--me:#dcebe8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a20;--card:#14262e;--ink:#e6efed;--dim:#8aa5a8;--line:#24404a;--up:#3ddc97;--down:#ff6b81;--accent:#7fd4cc;--on:#08242a;--me:#1d4048;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{padding:14px 16px 6px;font-weight:800;font-size:20px}
header span{font-weight:500;font-size:13px;color:var(--dim);display:block}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
#card{margin:6px 16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
#price{font-size:34px;font-weight:800;letter-spacing:-.5px}
#chg{font-weight:800;margin-left:8px}
.up{color:var(--up)}.down{color:var(--down)}
#meta{color:var(--dim);font-size:13px;margin-top:2px}
#spark{width:100%;height:70px;margin-top:8px;display:block}
#acts{display:flex;gap:8px;padding:8px 16px}
.btn{flex:1;font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--on);cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#log{flex:1;padding:6px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;background:var(--card);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--me);border-color:transparent}
#form{display:flex;gap:8px;padding:8px 16px 12px;position:sticky;bottom:0;background:var(--bg)}
#q{flex:1;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#note{color:var(--dim);font-size:12px;padding:0 16px 4px}
</style>
</head>
<body>
<header>Paper Desk<span>Live Gemini prices, with Claude&rsquo;s read. Practice only, not advice.</span></header>
<div id="chips" role="group" aria-label="Choose a coin"></div>
<div id="card">
  <div><span id="price">&hellip;</span><span id="chg"></span></div>
  <div id="meta">Loading price</div>
  <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"></svg>
</div>
<div id="acts">
  <button class="btn" id="an">Analyze</button>
  <button class="btn alt" id="plan">Paper trade plan</button>
</div>
<div id="log" aria-live="polite"></div>
<div id="note"></div>
<div id="form">
  <input id="q" placeholder="Ask about this coin" autocomplete="off" aria-label="Message">
  <button class="btn" id="send" style="flex:none">Send</button>
</div>
<script>
(function(){
var COINS=[['BTC','BTCUSD'],['ETH','ETHUSD'],['SOL','SOLUSD'],['XRP','XRPUSD'],['DOGE','DOGEUSD'],['LTC','LTCUSD'],['LINK','LINKUSD']];
var $=function(id){return document.getElementById(id)};
var cur=COINS[0],candles=[],tick=null,hist=[],mcp=null,sample=null,busy=false,seq=0;
function fmt(n){n=+n;return '$'+(n>=100?n.toLocaleString(undefined,{maximumFractionDigits:0}):n>=1?n.toFixed(2):n.toFixed(4))}
function add(t,me){var d=document.createElement('div');d.className='m'+(me?' me':'');d.textContent=t;$('log').appendChild(d);d.scrollIntoView({block:'end'});return d}
function parse(r){try{if(r.payload!=null&&typeof r.payload==='object')return r.payload;var t=(r.content||[]).filter(function(c){return c.type==='text'})[0];return JSON.parse(t?t.text:r.payload)}catch(e){return null}}
COINS.forEach(function(c){var b=document.createElement('button');b.className='chip';b.textContent=c[0];b.setAttribute('aria-pressed',c===cur);b.onclick=function(){pick(c)};c.btn=b;$('chips').appendChild(b)});
function pick(c){cur=c;COINS.forEach(function(x){x.btn.setAttribute('aria-pressed',x===c)});render()}
function spark(){var s=candles.slice(-30).map(function(c){return c[4]});if(s.length<2){$('spark').innerHTML='';return}
 var lo=Math.min.apply(null,s),hi=Math.max.apply(null,s),up=s[s.length-1]>=s[0];
 var pts=s.map(function(v,i){return (i/(s.length-1)*300).toFixed(1)+','+(66-(v-lo)/((hi-lo)||1)*62).toFixed(1)}).join(' ');
 $('spark').innerHTML='<polyline fill="none" stroke="'+(up?'var(--up)':'var(--down)')+'" stroke-width="2" vector-effect="non-scaling-stroke" points="'+pts+'"/>'}
var snap=null,stamp=0;
function render(){var d=snap&&snap[cur[1]];
 if(!d){tick=null;candles=[];$('price').textContent='\u2014';$('chg').textContent='';$('spark').innerHTML='';$('meta').textContent=snap?'No data for '+cur[0]+' yet. Ask Claude in chat to refresh.':'Waiting for Claude to send prices.';return}
 tick=d;candles=(d.changes||[]).map(function(x){x=+x;return [0,x,x,x,x,0]});
 var p=+d.close,o=+d.open,ch=(p-o)/o*100,age=Math.round((Date.now()-stamp)/60000);
 $('price').textContent=fmt(p);$('chg').textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';$('chg').className=ch>=0?'up':'down';
 $('meta').textContent='Low '+fmt(d.low)+' \u00b7 High '+fmt(d.high)+' \u00b7 Sent by Claude '+(age<1?'just now':age+' min ago')+(age>30?' (stale, ask Claude to refresh)':'');spark()}
function ctx(){if(!tick)return 'No price data loaded.';
 return 'Coin: '+cur[1]+'. Price '+tick.close+', 24h open '+tick.open+', high '+tick.high+', low '+tick.low+', bid '+tick.bid+', ask '+tick.ask+'.\nLast 24 hourly prices, oldest to newest: '+(tick.changes||[]).join(', ')+'.\nOnly 24 hours of data is available, so say plainly that longer-term trend and support levels cannot be judged from it.'}
var SYS='You are a careful crypto market analyst helping someone practice paper trading with fake money. Use only the data given; do not invent news. Be concise (under 170 words), plain text, no markdown symbols. Give levels (support, resistance), trend, and bull and bear scenarios. Never promise outcomes or claim to predict prices; say when evidence is weak. Remind once that this is practice, not financial advice.';
async function ask(text,show){if(busy)return;if(!sample){add('Asking Claude needs the Claude app or site. Prices still work.');return}
 busy=true;$('send').disabled=$('an').disabled=$('plan').disabled=true;
 if(show)add(show,true);hist.push({role:'user',content:text});
 var out=add('Thinking\u2026');
 var msgs=[{role:'user',content:SYS+'\n\nMarket data (refreshed each message):\n'+ctx()},{role:'assistant',content:'Understood.'}].concat(hist.slice(-8));
 try{var r=await sample(msgs,{cache:false,onText:function(u){out.textContent=u.text.replace(/\*\*/g,'')}});
  var t=r.text.replace(/\*\*/g,'');out.textContent=t;hist.push({role:'assistant',content:t})}
 catch(e){hist.pop();out.textContent=e&&e.code==='rate_limited'?'Too many requests. Wait a moment and try again.':'Claude could not answer ('+(e&&e.code||'error')+').'}
 busy=false;$('send').disabled=$('an').disabled=$('plan').disabled=false}
$('an').onclick=function(){ask('Analyze '+cur[0]+' now: trend, key support and resistance, and what would change your view.','Analyze '+cur[0])};
$('plan').onclick=function(){ask('Suggest one paper trade for '+cur[0]+' with limit entry, stop, target, and size risking 1% of a $10,000 paper account. Include reward-to-risk and when to skip the trade.','Paper trade plan for '+cur[0])};
function send(){var v=$('q').value.trim();if(!v)return;$('q').value='';ask(v,v)}
$('send').onclick=send;$('q').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
add('Pick a coin, then tap Analyze or ask me anything about it. Paper trading only.');
Promise.resolve().then(function(){return Promise.all([claude.use('db'),claude.use('sample')])}).then(function(a){var db=a[0];sample=a[1];$('note').textContent=sample?'':'Chat is off outside Claude.';
 if(!db){$('meta').textContent='Sign in to claude.ai to see prices.';return}
 db.doc('prices/latest').onSnapshot(function(sn){var d=sn.exists?sn.data():null;snap=d&&d.coins||null;stamp=d&&d.updatedAt||0;render()},function(){$('meta').textContent='Could not read prices.'})
}).catch(function(){$('meta').textContent='Prices unavailable here.'});
setInterval(render,30000);
})();
</script>
</body>
</html>
